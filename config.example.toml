# pgpu — Praxis GPU Router Konfiguration
# Kopieren nach config.toml und anpassen. Produktion: bind_ip = NetBird-IP.

[router]
bind_ip = "127.0.0.1"        # Produktion: NetBird-IP (z. B. 100.x.y.z)
dashboard_port = 8080
data_dir = "/data"           # lokal testen: "./data"
# Router-Token: API-Bearer + Dashboard-Login. env ROUTER_TOKEN überschreibt.
# Pflicht: mindestens 32 Zeichen (A-Z/a-z/0-9/-/_), z. B. openssl rand -hex 32.
# Leer bleibt absichtlich NICHT startfähig; ein Secret setzen oder per Env liefern.
token = ""
tz = "Europe/Berlin"
# Hold-Window für X-Router-Wait (Sekunden, 0 = sofort 503)
wait_for_backend_max_s = 600

[vast]
# api_key = ""               # oder env VAST_API_KEY
poll_interval_s = 30
offer_poll_s = 60
# Unabhängige Schalter. AUS löscht keine Einträge/Messdaten.
activate_blacklist = true    # gesperrte Hosts ausschließen (Default)
activate_whitelist = false   # AN: nur explizit freigegebene Hosts zulassen
# Beide AN: Whitelist nötig UND nicht blacklisted. Limits gelten immer.
# Host nach N Fails (warmup-Tod/unreachable/timeout) blacklisten; 0 = aus.
blacklist_after_fails = 2
# Unreachable-Box (Vast running, Agent tot) nach X s stoppen (Disk bleibt).
unreachable_stop_after_s = 300

[netbird]
cleanup_unused_peers = true # nur nachweislich entfernte eigene GPU-Peers; Schlaf/Stop bleibt geschützt
# Management-API-Token (nbt_...) für ephemerere Setup-Keys pro Instanz.
# Ohne: statischer setup_key (Fallback).
# api_token = "nbt_..."       # Cloud; self-hosted: PAT (nbp_...) + api_url
# api_url = "https://api.netbird.io"  # self-hosted: eigene Management-URL
# management_url = "https://api.netbird.io"  # PEER-Enrollment-Ziel (NB_MANAGEMENT_URL auf den Boxen)!
setup_key = ""
group = "gpu"
# Auto-Gruppen der geminteten Keys (Namen oder IDs). Die Boxen MÜSSEN in der
# Gruppe sein, die eure Router-/Entwicklungs-Policy erlaubt (z. B. "servers"
# für developers→servers) — sonst findet der Router-Dial die :9100 nicht.
groups = ["gpu", "servers"]
router_nb_ip = "100.64.0.1"  # NetBird-IP des Router-Hosts (Agents callen home)
router_nb_port = 8080

[stt]
mode = "local"               # "local" = Vosk-Sidecar im Router-Compose
url = "http://127.0.0.1:2701"   # Sidecar-Host-Port (compose: 127.0.0.1:2701:2700)

[budget]
daily_soft_eur = 2.0
daily_hard_eur = 2.4
monthly_eur = 50.0
usd_per_eur = 1.08

[limits]
max_instances = 3
max_per_slot = 2
max_total_rate_usd_h = 0.60

[alerts]
state_changes = true
spend_summary_interval_s = 14400 # alle vier Stunden; 0 deaktiviert die Übersicht
# Discord: Servereinstellungen → Integrationen → Webhooks → URL kopieren.
# webhook_urls = [
#   "https://discord.com/api/webhooks/ID_KANAL_1/TOKEN_1",
#   "https://discord.com/api/webhooks/ID_KANAL_2/TOKEN_2",
# ]
# webhook_format = "discord"  # auto (Default), discord, slack, ntfy oder json
# Die bisherige einzelne webhook_url bleibt gültig; doppelte URLs senden nur einmal.
# Jede Warnung/Testnachricht geht an alle Ziele (max. 16), mit separatem Ergebnis.
# Settings → Speichern → „Testnachricht senden“; alternativ POST /api/v1/alerts/test.
# Eine erfolgreiche Discord-Testnachricht lautet „✅ PGPU-Testnachricht …“.
# ntfy.sh wird automatisch erkannt; bei eigenem ntfy-Server webhook_format="ntfy".
# Generisches JSON: {"kind":"...","message":"..."}; Details: docs/webhooks.md.
# Die vollständige Webhook-URL ist ein Geheimnis — niemals ins Git einchecken.

# ------------------------------------------------------------- Slot 1: LLM

[[slots]]
id = 1
role = "llm"
name = "LLM (fork-llama)"
image = "vayayo/praxis-llamap-gs-gpu:latest"
disk_gb = 120
# 16-GB-Guide-Filter (5070 Ti rar, 4060 Ti/A4000 Alternativen):
search_query = 'gpu_ram>=15 cpu_ram>=30 disk_space>=120 inet_down>=500 disk_bw>=1500 reliability2>=0.95'
# Flash-Next-82GB-Rezept:
# search_query = 'gpu_name="RTX 5070 Ti" cpu_ram>=62 cuda_vers>=12.9 disk_space>=120 inet_down>=800 disk_bw>=1500 reliability2>=0.95'
passthrough = { 11434 = "api", 11435 = "webui", 11436 = "embed" }

# Ab 0.26: Settings-Karte; Länder-Näherung, kein tatsächlicher GPU-Host-Abstand.
[slots.location]
origin_country = "DE"
# countries = ["DE", "AT", "CH", "NL", "BE", "LU", "FR", "CZ", "PL", "DK"]
# excluded_countries = ["RU"]  # gewinnt immer; auch geolocation!=DE / notin im Suchstring
# radius_km = 1000.0           # nicht gesetzt = kein Radiusfilter; Liste und Radius werden geschnitten

[slots.services]
api = { port = 11434, health = "/health", busy = "inflight" }
webui = { port = 11435, busy = "inflight" }
embed = { port = 11436, health = "/health", busy = "inflight" }
agent = { port = 9100, busy = "none" }

[slots.bid]
margin = 0.15
ceiling_usd_h = 0.30
defend_when_busy = true

[slots.idle]
stop_after_s = 900            # 15 min
destroy_after_stopped_s = 172800  # 48 h Disk warm halten

[slots.swap]
on_preempt = true
on_bid_pressure = true
optimize_cost = false         # 82-GB-Download macht Swap teurer als Behalten
max_warmup_s = 2700           # 45 min (Model-Download)
keep_warm_window_s = 1800

# Lokale Prüfungen ZUSÄTZLICH zum Vast-Suchstring (auch manuelle Mieten).
[slots.requirements]
# gpu_names = ["RTX 5070 Ti", "RTX 4060 Ti", "RTX A4000", "RTX 3090"] # Alternativen, keine Teilstrings
# machine_ids = [12345, 67890] # zusätzliche harte Allowlist, unabhängig von [vast]
min_gpu_ram_gb = 15.0
min_cpu_ram_gb = 30.0
min_disk_bw = 1500.0
min_inet_down = 500.0
min_reliability = 0.95
num_gpus = 1
# min_cuda = 12.9             # Provider-CUDA-Version, NICHT Compute Capability
# max_storage_usd_h = 0.04
# max_download_usd_gb = 0.005
# max_effective_usd_h = 0.34  # GPU + Storage, zusätzlich zu slots.bid.ceiling_usd_h
# gpu_price_ceiling_usd_h = { "RTX 5090" = 0.30, "RTX 4060 Ti" = 0.15 }

# Alle neuen Mess-/Last-/Ranking-Funktionen standardmäßig AUS.
# Vollständige Anleitung: docs/gpu-performance.md
[slots.performance]
enabled = false
collect_usage = false        # passiv: JSON/SSE-Metadaten, keine Inhalte speichern
profile = "qwen-flash-next-quant-context-v1" # Quantisierung/Kontext/Runtime eindeutig benennen!
retention_days = 90          # Rohdaten; Lebenszeit-Aggregate bleiben erhalten
max_samples = 50000          # maximale Rohdaten-Zeilen pro Slot

[slots.performance.benchmark]
enabled = false             # zusätzlich Agent >=0.2.0 + PRAXIS_AGENT_ALLOW_BENCHMARK=1
auto_when_idle = false       # sonst nur manueller Button/API
min_interval_s = 86400       # auch fehlgeschlagene Versuche, persistent
idle_s = 120                 # kein In-flight/Batch/Agent-Busy

[slots.performance.benchmark.spec]
port = 11434                # muss einem Slot-Service entsprechen
model = ""                  # vor Aktivierung EXAKTEN /v1/models-Alias eintragen
requests = 3
prompt_repetitions = 64      # synthetisches Profil, keine Benutzer-Prompts
max_tokens = 128
timeout_s = 120              # hart begrenzt, 10..600 s
disk_read_mb = 0            # optional 1..256 MiB O_DIRECT, nur bestehende GGUF lesen

[slots.performance.score]
enabled = false             # AN: gute vergleichbare Benchmark-Hosts bevorzugen
preference_weight = 0.25     # max. ±25 % Ranking-Anpassung, kein Preislimit-Override
min_samples = 3
max_age_days = 30
decode_target_tps = 40.0     # 50 Punkte = konfiguriertes Ziel erreicht
prefill_target_tps = 500.0
ttft_target_ms = 1000.0
decode_weight = 0.7
prefill_weight = 0.2
ttft_weight = 0.1

# Extra-Env beim Create (Modellvariante!):
[slots.env]
LLAMA_MODEL = "qwen3.8-flash-next"
LLAMA_DOWNLOAD_MODELS = "1"
# traffic_gb = 85.0            # Score-Gewichtung: geschätzter Model-Traffic
# warm_hours = "09:00-18:00"   # Slot automatisch warm halten im Fenster

# ----------------------------------------------------------- Slot 2: Media

[[slots]]
id = 2
role = "media"
name = "Media (fork-comfyui)"
image = "vayayo/praxis-comfyui-gpu:latest"
disk_gb = 60
search_query = 'gpu_ram>=23 gpu_name="RTX 3090" disk_space>=60 inet_down>=300 reliability2>=0.95'
passthrough = { 8188 = "comfy" }
# STT läuft im Router (stt.mode=local); 2700 → Sidecar. Legacy-Slot:
# passthrough = { 8188 = "comfy", 2700 = "stt" }

[slots.services]
comfy = { port = 8188, health = "/object_info/PraxisQwen3TTS", busy = "comfy_queue" }
stt = { port = 2700, health = "/health", busy = "ws_sessions" }
agent = { port = 9100, busy = "none" }

[slots.bid]
margin = 0.10
ceiling_usd_h = 0.20
defend_when_busy = true

[slots.idle]
stop_after_s = 600
destroy_after_stopped_s = 3600

[slots.swap]
on_preempt = true
on_bid_pressure = true
optimize_cost = true          # Frisch-Instanzen sind billig (kleines Image)
min_savings_pct = 25
max_warmup_s = 1200
min_swap_interval_s = 3600

[slots.env]
PRAXIS_QWEN_TTS_DOWNLOAD = "1"
VOSK_DOWNLOAD_MODELS = "1"