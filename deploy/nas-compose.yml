# NAS — Dual-NetBird: ein Peer in tgrid, ein Peer in jfinx (GPU-Netz).
#
# Setup-Keys kommen aus der Umgebung/.env — keine echten Keys committen.
# `docker compose -f nas-compose.yml up -d` starten. Voraussetzungen auf
# dem NAS: Docker + Compose v2, /dev/net/tun (haben die anderen NetBird-
# Stacks schon: jellyfin/immich/… laufen nach demselben Muster).
#
# Was hier enrollt:
#   * netbird-tgrid → NB_TGRID_MANAGEMENT_URL, Peer "nas", Gruppen developers+servers
#     (reusable Key lokal per NB_TGRID_SETUP_KEY setzen)
#   * netbird-jfinx → NB_JFINX_MANAGEMENT_URL, Peer "nas", Gruppe operators
#     (reusable Key lokal per NB_JFINX_SETUP_KEY setzen) — Zugriff auf den GPU-Stack:
#     Router-Dashboard :8080, Praxis :1337, Gateway :3537, ComfyUI :8188,
#     STT :2700, llama :11434-36 (sobald der Router in jfinx migriert ist).
#
# Betrieb:
#   Status:   docker compose -f nas-compose.yml exec tgrid netbird status
#             docker compose -f nas-compose.yml exec jfinx netbird status
#   Logs:     docker compose -f nas-compose.yml logs -f tgrid   (bzw. jfinx)
#   Update:   docker compose -f nas-compose.yml pull && \
#             docker compose -f nas-compose.yml up -d
#
# ⚠️ Die Volumes tgrid-config/jfinx-config enthalten die Peer-Identitäten
#    (WireGuard-Keys) — NICHT löschen, sonst enrollt der Peer neu (neue IP).
#    Backup: docker run --rm -v nas-netbird_tgrid-config:/d -v $PWD:/b \
#              alpine tar czf /b/nb-tgrid-config.tgz -C /d .
#    (analog nas-netbird_jfinx-config)
#
# Später einen NAS-Service an eins der Netze hängen (Sidecar-Muster wie im
# Heim-Stack): Service bekommt  network_mode: "service:tgrid"  (bzw. jfinx)
# und erreicht Peers über deren Overlay-IP; /etc/netbird-Volumes bleiben solo.

name: nas-netbird

services:
  tgrid:
    image: netbirdio/netbird:latest
    container_name: netbird-tgrid
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NB_MANAGEMENT_URL: ${NB_TGRID_MANAGEMENT_URL:?NB_TGRID_MANAGEMENT_URL setzen}
      NB_SETUP_KEY: ${NB_TGRID_SETUP_KEY:?NB_TGRID_SETUP_KEY setzen}
      NB_HOSTNAME: nas
    volumes:
      - tgrid-config:/etc/netbird
    restart: unless-stopped

  jfinx:
    image: netbirdio/netbird:latest
    container_name: netbird-jfinx
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NB_MANAGEMENT_URL: ${NB_JFINX_MANAGEMENT_URL:?NB_JFINX_MANAGEMENT_URL setzen}
      NB_SETUP_KEY: ${NB_JFINX_SETUP_KEY:?NB_JFINX_SETUP_KEY setzen}
      NB_HOSTNAME: nas
    volumes:
      - jfinx-config:/etc/netbird
    restart: unless-stopped

volumes:
  tgrid-config:
  jfinx-config:
