name: offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests must never depend on account credentials or deployed infrastructure.
      VAST_API_KEY: ""
      NB_API_TOKEN: ""
      ROUTER_TOKEN: offline-ci-token-not-a-secret-123456789
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Regression and unit tests
        run: cargo +stable test --workspace --locked
      - name: Critical async lint gates
        run: cargo +stable clippy --workspace --all-targets --locked -- -D clippy::let_underscore_future -D clippy::await_holding_lock
      - name: Build binaries
        run: cargo +stable build --workspace --locked
      - name: Isolated process smoke test
        run: python3 scripts/smoke.py
